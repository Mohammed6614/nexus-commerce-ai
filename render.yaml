services:
  - type: web
    name: nexus-commerce-ai
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        value: "https://<your-render-service>.onrender.com"
      - key: NEXTAUTH_SECRET
        value: "replace-with-a-secure-secret"
      - key: DATABASE_URL
        fromDatabase: nexus-commerce-db
      - key: OPENAI_API_KEY
        value: "replace-with-openai-key"
      - key: STRIPE_SECRET_KEY
        value: "replace-with-stripe-key"
      - key: META_ACCESS_TOKEN
        value: "replace-with-meta-access-token"
      - key: META_AD_ACCOUNT_ID
        value: "replace-with-meta-ad-account-id"
      - key: META_PAGE_ID
        value: "replace-with-meta-page-id"
      - key: TABBY_API_KEY
        value: "replace-with-tabby-api-key"

databases:
  - name: nexus-commerce-db
    databaseType: postgresql
    plan: starter
    region: oregon
    postgresVersion: "16"
